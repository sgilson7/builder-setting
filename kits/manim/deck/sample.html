<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manim kit sample</title>
<link rel="stylesheet" href="manim/theme.css">
<link rel="stylesheet" href="manim/player.css">
<style>
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg); font-family: var(--body); }
  main { max-width: 760px; margin: 0 auto; }
  section { margin-bottom: 48px; }
</style>
</head>
<body>
<main>
  <section>
    <h1>From a scene file to the deck</h1>
    <p>A scene file of boxes, lines and steps.</p>
    <div data-manim="sample-flow"></div>
  </section>
  <section>
    <h2>Twelve dots, three ways</h2>
    <p>A code scene: Manim code moves the dots.</p>
    <div data-manim="sample-dots"></div>
  </section>
</main>
<script type="application/json" id="manim-labels">
{"play": "Play", "pause": "Pause", "back": "‹ Back", "backName": "Previous step", "next": "Next ›", "nextName": "Next step",
 "restart": "Restart", "count": "step {n} of {of}", "everyStep": "Every step, as text",
 "failed": "The animation could not load its files. Open this page through a web server, not from disk."}
</script>
<script src="manim/player.js"></script>
</body>
</html>
